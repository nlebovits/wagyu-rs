[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.75"
authors = ["Nissim Lebovits <nlebovits@pm.me>"]
license = "BSL-1.0"
repository = "https://github.com/nlebovits/wagyu-rs"
homepage = "https://github.com/nlebovits/wagyu-rs"
keywords = ["geometry", "polygon", "clipping", "boolean-operations", "geospatial"]
categories = ["science", "algorithms", "mathematics"]

[workspace.dependencies]
# Internal crates
wagyu-rs = { path = "crates/core", version = "0.1.1" }

# Core geometry
geo = "0.32"
geo-types = "0.7"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
log = "0.4"
env_logger = "0.11"
num-traits = "0.2"

# Testing
approx = "0.5"

# Serialization (for test fixtures)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[profile.bench]
inherits = "release"
